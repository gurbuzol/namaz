        %22display%22:%22standalone%22,

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-card {
            background-color: #111827;
            border: 1px solid #1f2937;
        }
        .btn-status {
            transition: all 0.15s ease;
        }
        .btn-status:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen pb-8">

    <!-- Üst Bar -->
    <header class="app-card sticky top-0 z-50 px-4 py-3 shadow-md border-b border-gray-800">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-kaaba"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-gray-100 leading-tight">Namaz Takip</h1>
                    <p class="text-[11px] text-gray-400">Kişisel Kaza & Eda Rehberi</p>
                </div>
            </div>
            
            <button onclick="handleBackupShare()" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-medium flex items-center space-x-1.5 border border-gray-700 transition">
                <i class="fa-solid fa-rotate-left text-emerald-400"></i>
                <span>Yedekle</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3.5 mt-3.5 space-y-3.5">

        <!-- Özet Durum Kartı -->
        <section class="app-card rounded-2xl p-3.5 shadow-sm">
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-pie text-emerald-400"></i> ÖZET DURUM
                </h2>
                <span id="kazaSummaryBadge" class="text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-gray-800 text-gray-300 border border-gray-700">
                    Kaza Borcu Yok 👍
                </span>
            </div>
            
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800/80">
                    <span class="block text-[11px] text-gray-400 mb-0.5">
                        <i class="fa-solid fa-circle text-rose-500 text-[8px] mr-1"></i>Kaçırılan
                    </span>
                    <span id="totalKacirilan" class="text-base font-bold text-rose-400">0</span>
                </div>
                <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800/80">
                    <span class="block text-[11px] text-gray-400 mb-0.5">
                        <i class="fa-solid fa-circle text-amber-500 text-[8px] mr-1"></i>Kaza Eda
                    </span>
                    <span id="totalKazaEda" class="text-base font-bold text-amber-400">0</span>
                </div>
                <div class="bg-gray-900/80 p-2 rounded-xl border border-gray-800/80">
                    <span class="block text-[11px] text-gray-400 mb-0.5">
                        <i class="fa-solid fa-circle text-emerald-500 text-[8px] mr-1"></i>Vaktinde
                    </span>
                    <span id="totalVaktinde" class="text-base font-bold text-emerald-400">0</span>
                </div>
            </div>
        </section>

        <!-- Tarih Gezinme Barı -->
        <section class="app-card rounded-2xl p-2.5 flex items-center justify-between shadow-sm">
            <button onclick="changeDate(-1)" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs flex items-center space-x-1 border border-gray-700">
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                <span>Önceki</span>
            </button>
            
            <div class="text-center">
                <div id="currentDateDisplay" class="font-bold text-sm text-gray-100">--.--.----</div>
                <div id="currentDayDisplay" class="text-[11px] font-medium text-emerald-400 mt-0.5">Bugün</div>
            </div>

            <button onclick="changeDate(1)" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs flex items-center space-x-1 border border-gray-700">
                <span>Sonraki</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </section>

        <!-- Vakit Kartları Listesi -->
        <section id="vakitlerContainer" class="space-y-3">
            <!-- JavaScript ile dinamik dolacak -->
        </section>

    </main>

    <script>
        const VAKITLER = [
            { id: 'sabah', label: 'Sabah', icon: 'fa-sun' },
            { id: 'ogle', label: 'Öğle', icon: 'fa-sun' },
            { id: 'ikindi', label: 'İkindi', icon: 'fa-cloud-sun' },
            { id: 'aksam', label: 'Akşam', icon: 'fa-moon' },
            { id: 'yatsi', label: 'Yatsı', icon: 'fa-star' }
        ];

        const STATUSES = [
            { id: 'gelecek', label: 'Gelecek', color: 'bg-gray-800 text-gray-300 border-gray-700', dot: 'bg-gray-400' },
            { id: 'vaktinde', label: 'Eda', color: 'bg-emerald-950/80 text-emerald-400 border-emerald-800', dot: 'bg-emerald-400' },
            { id: 'kacirildi', label: 'Kaza', color: 'bg-rose-950/80 text-rose-400 border-rose-800', dot: 'bg-rose-500' },
            { id: 'kaza_edildi', label: 'Kaza Eda', color: 'bg-amber-950/80 text-amber-400 border-amber-800', dot: 'bg-amber-400' }
        ];

        let currentDate = new Date();
        let appData = JSON.parse(localStorage.getItem('namaz_takip_data')) || {};

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateDisplay(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}.${m}.${y}`;
        }

        function getDayName(date) {
            const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
            const dayName = days[date.getDay()];
            
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return `Bugün (${dayName})`;
            }
            return dayName;
        }

        function renderUI() {
            const dateKey = formatDateKey(currentDate);
            document.getElementById('currentDateDisplay').innerText = formatDateDisplay(currentDate);
            document.getElementById('currentDayDisplay').innerText = getDayName(currentDate);

            if (!appData[dateKey]) {
                appData[dateKey] = {
                    sabah: 'gelecek',
                    ogle: 'gelecek',
                    ikindi: 'gelecek',
                    aksam: 'gelecek',
                    yatsi: 'gelecek'
                };
            }

            const container = document.getElementById('vakitlerContainer');
            container.innerHTML = '';

            VAKITLER.forEach(vakit => {
                const currentStatus = appData[dateKey][vakit.id] || 'gelecek';

                const card = document.createElement('div');
                card.className = 'app-card rounded-2xl p-3 shadow-sm space-y-2';
                
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-800 pb-1.5">
                        <span class="font-bold text-xs text-gray-200 flex items-center gap-1.5">
                            <i class="fa-solid ${vakit.icon} text-gray-400 text-xs"></i>
                            ${vakit.label}
                        </span>
                        <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-gray-900 text-gray-400 border border-gray-800">
                            Zamanı Gelmedi
                        </span>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5">
                        ${STATUSES.map(st => `
                            <button onclick="setStatus('${vakit.id}', '${st.id}')" 
                                class="btn-status text-[11px] font-medium py-1.5 rounded-xl border flex items-center justify-center gap-1 ${currentStatus === st.id ? st.color : 'bg-gray-900/60 text-gray-400 border-gray-800/80 hover:bg-gray-800'}">
                                <span class="w-1.5 h-1.5 rounded-full ${st.dot}"></span>
                                <span>${st.label}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });

            calculateSummary();
            saveToStorage();
        }

        function setStatus(vakitId, statusId) {
            const dateKey = formatDateKey(currentDate);
            appData[dateKey][vakitId] = statusId;
            renderUI();
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            renderUI();
        }

        function calculateSummary() {
            let kacirilan = 0;
            let kazaEdilen = 0;
            let vaktinde = 0;

            Object.values(appData).forEach(day => {
                Object.values(day).forEach(st => {
                    if (st === 'kacirildi') kacirilan++;
                    if (st === 'kaza_edildi') kazaEdilen++;
                    if (st === 'vaktinde') vaktinde++;
                });
            });

            document.getElementById('totalKacirilan').innerText = kacirilan;
            document.getElementById('totalKazaEda').innerText = kazaEdilen;
            document.getElementById('totalVaktinde').innerText = vaktinde;

            const netKaza = kacirilan - kazaEdilen;
            const badge = document.getElementById('kazaSummaryBadge');

            if (netKaza > 0) {
                badge.innerText = `${netKaza} Vakit Kaza Borcu`;
                badge.className = 'text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-rose-500/10 text-rose-300 border border-rose-500/20';
            } else {
                badge.innerText = 'Kaza Borcu Yok 👍';
                badge.className = 'text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-gray-800 text-gray-300 border border-gray-700';
            }
        }

        function saveToStorage() {
            localStorage.setItem('namaz_takip_data', JSON.stringify(appData));
        }

        async function handleBackupShare() {
            const dataStr = JSON.stringify(appData, null, 2);
            const fileName = `namaz_takip_yedek_${formatDateKey(new Date())}.json`;
            const file = new File([dataStr], fileName, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Namaz Takip Yedeği',
                        text: 'Namaz takip uygulaması güncel veri yedeği.',
                        files: [file]
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        downloadBackupFile(dataStr, fileName);
                    }
                }
            } else {
                downloadBackupFile(dataStr, fileName);
            }
        }

        function downloadBackupFile(content, fileName) {
            const blob = new Blob([content], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }

        // İlk Yükleme
        renderUI();
    </script>
</body>
